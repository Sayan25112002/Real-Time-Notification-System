<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Notifications</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }
        .container {
            width: 100%;
            max-width: 850px;
        }
        .header {
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            color: #0f172a;
        }
        .header p {
            color: #64748b;
            font-size: 15px;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-top: 16px;
            padding: 8px 14px;

            border-radius: 20px;

            background: #fee2e2;
            color: #b91c1c;

            font-size: 13px;
            font-weight: 600;
        }
        .status.connected {
            background: #dcfce7;
            color: #15803d;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);

            border-radius: 20px;
            padding: 28px;

            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
        }
        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .card-subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 22px;
        }
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            padding: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            font-family: inherit;
            font-size: 15px;
            color: #1e293b;
            transition: 0.2s;
        }
        textarea:focus {
            border-color: #6366f1;
            box-shadow:
                    0 0 0 4px rgba(99, 102, 241, 0.12);
        }
        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px 22px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }
        .section {
            margin-top: 28px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        #notifications {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .notification {
            background: white;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #4f46e5;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(15, 23, 42, 0.04);
            animation: slideIn 0.3s ease;
        }
        .notification-message {
            font-size: 15px;
            line-height: 1.5;
        }
        .notification-time {
            margin-top: 7px;
            color: #94a3b8;
            font-size: 12px;
        }
        .empty {
            color: #94a3b8;
            text-align: center;
            padding: 25px;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 600px) {
            body {
                padding: 16px;
            }
            .card {
                padding: 20px;
            }
            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Real-Time Notifications</h1>
        <p>
            Send notifications to all connected users in real time.
        </p>
        <div class="status connected">
            <span class="status-dot"></span>
            Connected
        </div>
    </div>
    <div class="card">
        <div class="card-title">
            Send Notification
        </div>
        <div class="card-subtitle">
            Enter your message and send it to all connected users.
        </div>
        <div class="input-section">
        <textarea
                id="message"
                placeholder="Enter your message..."
        ></textarea>
            <button onclick="sendMessage()">
                Send
            </button>

        </div>
        <div class="section">
            <div class="section-title">
                Recent Notifications
            </div>
            <div id="notifications">
                <div class="empty">
                    No notifications sent yet.
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    let stompClient = null;
    function connect() {
        const socket = new SockJS('http://localhost:8080/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame) {
                console.log(
                    'Connected: ' + frame
                );
                stompClient.subscribe(
                    '/topic/notifications',
                    function (message) {
                        showNotification(
                            message.body
                        );
                    }
                );
            },
            function (error) {
                console.error(
                    'WebSocket connection error: ',
                    error
                );
            }
        );
    }

    function sendMessage() {
        const message =
            document.getElementById('message').value.trim();
        if (!message) {
            return;
        }
        if (stompClient && stompClient.connected) {
            stompClient.send(
                '/app/sendMessage',
                {},
                message
            );
            console.log(
                'Message sent:',
                message
            );
            document.getElementById('message').value = '';
        } else {
            console.error(
                'WebSocket connection is not established.'
            );
        }
    }

    function showNotification(message) {
        const notifications = document.getElementById('notifications');
        const empty =
            notifications.querySelector('.empty');
        if (empty) {
            empty.remove();
        }
        const notification = document.createElement('div');
        notification.className = 'notification';
        notification.innerHTML = `
            <div class="notification-message">
                ${message}
            </div>

            <div class="notification-time">
                Just now
            </div>
        `;
        notifications.prepend(notification);
    }

    connect();

</script>
</body>
</html>
